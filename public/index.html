<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Painel de Ativos B3</title>
  <link
    rel="stylesheet"
    href="vendor/bootstrap-5.3.3/bootstrap.min.css"
  />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    (() => {
      try {
        const tema = localStorage.getItem('b3.tema.v1');
        document.documentElement.setAttribute('data-bs-theme', tema === 'dark' ? 'dark' : 'light');
      } catch {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
</head>
<body class="bg-body-tertiary">
  <div id="app-header-outlet"></div>

  <main id="app-outlet" class="container py-3 pb-5"></main>

  <div id="app-bottom-nav-outlet"></div>

  <script
    src="vendor/bootstrap-5.3.3/bootstrap.bundle.min.js"
  ></script>
  <script
    src="vendor/lightweight-charts-4.2.0/lightweight-charts.standalone.production.js"
  ></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
